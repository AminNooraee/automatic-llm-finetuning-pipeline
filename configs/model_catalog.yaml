schema_version: 1

# Model allowlist for the GitLab user-job flow.
#
# Scope:
#   - Official, first-party Hugging Face checkpoints from model families that the
#     current Project-1 compatibility code can resolve: Qwen/Qwen2/Qwen2.5,
#     Llama 2/3.x, Mistral (model_type=mistral), and Gemma/Gemma2/Gemma3.
#   - Standard Transformers/Safetensors causal/text-generation checkpoints.
#   - Includes base, chat/instruct, code/math/reasoning variants where the
#     underlying model_type is one of the currently supported types.
#
# Intentionally excluded:
#   - Quantized / converted variants (AWQ, GPTQ, GGUF, MLX, FP8, QAT, etc.).
#   - Community forks, mirrors, merges, adapters and third-party fine-tunes.
#   - Multimodal/audio/VL architectures whose top-level model_type is not
#     currently supported (for example Qwen-VL/Omni, Llama Vision, mistral3).
#   - Classifier/reward/PRM/RM/embedding checkpoints.
#   - Newer generations not recognized by the current compatibility layer
#     (for example Qwen3+, Llama 4, Gemma 4, mistral3).
#
# parameter_count:
#   Whole-model parameter count used by resource preflight. Values are taken
#   from official Hugging Face metadata/model cards when available; when Hugging
#   Face reports a rounded size, the catalog uses that rounded/conservative size.
#
# precision:
#   bf16 is the default for the H100-oriented catalog. The already validated
#   Qwen2.5-0.5B-Instruct entry intentionally remains fp32.
#
# attention_backend:
#   eager is kept across the catalog for the conservative/portable path. We can
#   optimize this per model later after GPU qualification.
#
# NOTE: Presence in this file makes the model selectable by prepare_ci_job.py.
# Family-level compatibility does NOT mean every entry has completed the same
# weight-level E2E qualification as Qwen/Qwen2.5-0.5B-Instruct.

architecture_metadata:
  schema_version: 1
  snapshot_date: '2026-10-11'
  source: Hugging Face config.json / Hugging Face Transformers model documentation
  normalized_fields:
  - model_type
  - hidden_size
  - num_hidden_layers
  - num_attention_heads
  - num_key_value_heads
  - head_dim
  - max_position_embeddings
  - sliding_window
  notes:
  - Public Qwen and Mistral-family values are normalized from their Hugging Face model configs.
  - For gated Meta Llama and Google Gemma repositories, architecture values are normalized from
    Hugging Face-hosted equivalent configs and/or Hugging Face Transformers documentation where
    direct official config access is gated.
  - head_dim is taken from config when present; otherwise it is normalized from the model's
    documented attention geometry (older Qwen uses kv_channels).
  - num_key_value_heads is normalized to num_attention_heads for older MHA models that do not expose
    a separate KV-head field.
  - max_position_embeddings reflects the referenced Hugging Face config/model generation; it is not
    the same as the pipeline serving max_model_len.
  - sliding_window is null when the referenced architecture/config has no active explicit
    sliding-window value.
  - precision and attention_backend remain Project-1 policy fields and were not replaced by Hugging
    Face torch_dtype/runtime defaults.
