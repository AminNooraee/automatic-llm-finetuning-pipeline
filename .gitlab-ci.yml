stages:
  - job-prepare
  - smoke
  - admission-validation
  - finetune
  - benchmark-prepare
  - benchmark

variables:
  GPU_RUNNER_TAG: "finetune-gpu"
  PHASE1_GPU_RUNNER_TAG: "worker-server53"

prepare-user-job:
  stage: job-prepare

  tags:
    - $PHASE1_GPU_RUNNER_TAG

  script:
    - |
      set -eu

      PREPARE_IMAGE="automatic-llm-job-preparer:$CI_COMMIT_SHA"

      echo "=== PREPARING USER JOB ==="
      echo "Docker build mode: host-dns"

      . "$CI_PROJECT_DIR/scripts/build_dns.sh"

      if [ -n "${PIPELINE_DOCKER_BUILD_DNS:-}" ]; then
        BUILD_DNS_RESOLVERS=$(normalize_build_dns "$PIPELINE_DOCKER_BUILD_DNS" strict) || {
          echo "Invalid PIPELINE_DOCKER_BUILD_DNS." >&2
          exit 2
        }
      else
        BUILD_DNS_RESOLVERS=$(discover_build_dns /etc/resolv.conf) || {
          echo "No usable DNS resolver found on host." >&2
          exit 2
        }
      fi

      echo "Using host DNS resolvers: $BUILD_DNS_RESOLVERS"

      DNS_CONTEXT_DIR=$(mktemp -d "${TMPDIR:-/tmp}/job-preparer-dns.XXXXXX")
      chmod 700 "$DNS_CONTEXT_DIR"

      cleanup() {
        rm -rf -- "$DNS_CONTEXT_DIR"
      }
      trap cleanup EXIT HUP INT TERM

      : > "$DNS_CONTEXT_DIR/resolv.conf"
      for resolver in $BUILD_DNS_RESOLVERS; do
        printf 'nameserver %s\n' "$resolver" >> "$DNS_CONTEXT_DIR/resolv.conf"
      done
      chmod 644 "$DNS_CONTEXT_DIR/resolv.conf"

      docker build \
        --network=host \
        --build-context "pipeline_dns=$DNS_CONTEXT_DIR" \
        -f docker/Dockerfile.controller.host-dns \
        --build-arg "SOURCE_REVISION=$CI_COMMIT_SHA" \
        --build-arg "SOURCE_IDENTITY=$CI_COMMIT_SHA-job-preparer" \
        -t "$PREPARE_IMAGE" \
        .

      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --mount "type=bind,src=$CI_PROJECT_DIR,dst=/workspace" \
        --workdir /workspace \
        "$PREPARE_IMAGE" \
        python scripts/prepare_ci_job.py

      echo "=== USER JOB PREPARED ==="

  artifacts:
    paths:
      - ci_artifacts/job/
    expire_in: 30 days
    when: on_success


gpu-runner-smoke-test:
  stage: smoke

  tags:
    - $GPU_RUNNER_TAG

  script:
    - echo "=== SELECTED RUNNER TAG ==="
    - echo "$GPU_RUNNER_TAG"

    - 'test -n "${SERVING_ADVERTISE_HOST:-}" || { echo "SERVING_ADVERTISE_HOST must be supplied by the runner environment." >&2; exit 1; }'
    - echo "=== SERVING ADVERTISE HOST ==="
    - printf '%s\n' "$SERVING_ADVERTISE_HOST"

    - echo "=== HOST ==="
    - hostname

    - echo "=== USER ==="
    - whoami
    - id

    - echo "=== GPU ==="
    - nvidia-smi --query-gpu=index,name,memory.used,memory.total --format=csv,noheader

    - echo "=== DOCKER ==="
    - docker version --format '{{.Server.Version}}'

    - echo "=== RUNNER SMOKE TEST PASSED ==="

gpu-admission-validation:
  stage: admission-validation

  tags:
    - $GPU_RUNNER_TAG

  variables:
    GPU_DEVICE: "auto"

  when: manual

  script:
    - 'test -n "${GPU_MIN_FREE_MIB:-}" || { echo "GPU_MIN_FREE_MIB must be supplied explicitly." >&2; exit 1; }'
    - sh scripts/gpu_preflight.sh

phase1-finetune:
  stage: finetune
  resource_group: phase1-finetune

  tags:
    - $PHASE1_GPU_RUNNER_TAG



  variables:
    PIPELINE_CONFIG: "ci_artifacts/job/finetune.yaml"
    PIPELINE_RESOURCE_PREFLIGHT: "1"
    GPU_DEVICE: "auto"
    GPU_PREFLIGHT_ENV_FILE: "$CI_PROJECT_DIR/.phase1-gpu.env"
    PHASE1_MANIFEST_MARKER: "$CI_PROJECT_DIR/.phase1-manifest-marker"

  when: manual
  allow_failure: false

  script:
    - 'test -n "${SERVING_ADVERTISE_HOST:-}" || { echo "SERVING_ADVERTISE_HOST must be supplied explicitly." >&2; exit 1; }'
    - 'test -n "${PIPELINE_RUNS_DIR:-}" || { echo "PIPELINE_RUNS_DIR must be supplied explicitly." >&2; exit 1; }'
    - 'test -n "${PIPELINE_HF_CACHE_DIR:-}" || { echo "PIPELINE_HF_CACHE_DIR must be supplied explicitly." >&2; exit 1; }'
    - 'test -n "${PIPELINE_STATE_DIR:-}" || { echo "PIPELINE_STATE_DIR must be supplied explicitly." >&2; exit 1; }'
    - 'test -n "${LITELLM_BASE_URL:-}" || { echo "LITELLM_BASE_URL must be supplied explicitly." >&2; exit 1; }'
    - 'test -n "${LITELLM_API_KEY:-}" || { echo "LITELLM_API_KEY must be supplied explicitly." >&2; exit 1; }'

    - export PIPELINE_DATASETS_DIR="$CI_PROJECT_DIR/ci_artifacts/job"

    - 'test -r "$CI_PROJECT_DIR/$PIPELINE_CONFIG" || { echo "Generated fine-tune config is missing." >&2; exit 1; }'
    - |
      TRAIN_DATASET_PATH=$(python3 scripts/validate_prepared_train.py "$PIPELINE_DATASETS_DIR") || exit 1
      test -r "$TRAIN_DATASET_PATH" || { echo "Generated training dataset is missing." >&2; exit 1; }

    - |
      for directory in "$PIPELINE_RUNS_DIR" "$PIPELINE_HF_CACHE_DIR" "$PIPELINE_STATE_DIR"; do
        test -d "$directory" || { echo "Required directory does not exist: $directory" >&2; exit 1; }
        test -w "$directory" || { echo "Required directory is not writable: $directory" >&2; exit 1; }
      done
    - |
      touch "$PHASE1_MANIFEST_MARKER"
      sh scripts/run_pipeline.sh "$PIPELINE_CONFIG"
    - |
      manifests=$(find "$PIPELINE_RUNS_DIR" -type f -name gateway_manifest.json -newer "$PHASE1_MANIFEST_MARKER" -print)
      manifest_count=$(printf '%s\n' "$manifests" | awk 'NF { count++ } END { print count + 0 }')
      case "$manifest_count" in
        0) echo "No new gateway_manifest.json was created by this job." >&2; exit 1 ;;
        1) ;;
        *) echo "Expected exactly one new gateway_manifest.json, found $manifest_count." >&2; exit 1 ;;
      esac
      mkdir -p "$CI_PROJECT_DIR/ci_artifacts/project1"
      cp "$manifests" "$CI_PROJECT_DIR/ci_artifacts/project1/gateway_manifest.json"
    - |
      benchmark_files=$(find "$CI_PROJECT_DIR/ci_artifacts/job" \
        -maxdepth 1 -type f -name 'benchmark.*' -print)

      benchmark_count=$(printf '%s\n' "$benchmark_files" \
        | awk 'NF { count++ } END { print count + 0 }')

      if [ "$benchmark_count" != "1" ]; then
        echo "Expected exactly one benchmark dataset, found $benchmark_count." >&2
        exit 1
      fi

      PROJECT1_BENCHMARK_FILE=$(basename "$benchmark_files")

      umask 077
      {
        printf 'PROJECT1_UPSTREAM_PROJECT_ID=%s\n' "$CI_PROJECT_ID"
        printf 'PROJECT1_UPSTREAM_PIPELINE_ID=%s\n' "$CI_PIPELINE_ID"
        printf 'PROJECT1_UPSTREAM_JOB_ID=%s\n' "$CI_JOB_ID"
        printf 'PROJECT1_UPSTREAM_COMMIT_SHA=%s\n' "$CI_COMMIT_SHA"
        printf 'PROJECT1_BENCHMARK_FILE=%s\n' "$PROJECT1_BENCHMARK_FILE"
      } > "$CI_PROJECT_DIR/ci_artifacts/project1/upstream.env"

  after_script:
    - rm -f "$GPU_PREFLIGHT_ENV_FILE" "$PHASE1_MANIFEST_MARKER"

  artifacts:
    paths:
      - ci_artifacts/project1/gateway_manifest.json
      - ci_artifacts/project1/upstream.env
      - ci_artifacts/job/benchmark.*
      - ci_artifacts/job/job_manifest.json
    expire_in: 30 days
    when: on_success

prepare-phase1-benchmark-trigger:
  stage: benchmark-prepare

  tags:
    - $PHASE1_GPU_RUNNER_TAG

  needs:
    - job: phase1-finetune
      artifacts: true

  script:
    - 'test -s "$CI_PROJECT_DIR/ci_artifacts/project1/gateway_manifest.json" || { echo "Missing Project 1 gateway manifest." >&2; exit 1; }'
    - 'test -s "$CI_PROJECT_DIR/ci_artifacts/project1/upstream.env" || { echo "Missing Project 1 upstream metadata." >&2; exit 1; }'
    - |
      . "$CI_PROJECT_DIR/ci_artifacts/project1/upstream.env"
      handoff_b64=$(base64 "$CI_PROJECT_DIR/ci_artifacts/project1/gateway_manifest.json" | tr -d '\r\n')
      test -n "$handoff_b64" || { echo "Failed to encode Project 1 handoff manifest." >&2; exit 1; }

      mkdir -p "$CI_PROJECT_DIR/ci_artifacts/project1"
      umask 077
      {
        printf '%s\n' 'stages:'
        printf '%s\n' '  - benchmark'
        printf '%s\n' ''
        printf '%s\n' 'trigger-project2-benchmark:'
        printf '%s\n' '  stage: benchmark'
        printf '%s\n' '  variables:'
        printf '    PROJECT1_HANDOFF_B64: "%s"\n' "$handoff_b64"
        printf '    PROJECT1_UPSTREAM_PROJECT_ID: "%s"\n' "$PROJECT1_UPSTREAM_PROJECT_ID"
        printf '    PROJECT1_UPSTREAM_PIPELINE_ID: "%s"\n' "$PROJECT1_UPSTREAM_PIPELINE_ID"
        printf '    PROJECT1_UPSTREAM_JOB_ID: "%s"\n' "$PROJECT1_UPSTREAM_JOB_ID"
        printf '    PROJECT1_UPSTREAM_COMMIT_SHA: "%s"\n' "$PROJECT1_UPSTREAM_COMMIT_SHA"
        printf '    PROJECT1_BENCHMARK_FILE: "%s"\n' "$PROJECT1_BENCHMARK_FILE"
        printf '%s\n' '  trigger:'
        printf '%s\n' '    project: llm-projects/automatic-llm-benchmark-pipeline'
        printf '%s\n' '    branch:  main'
        printf '%s\n' '    strategy: depend'
      } > "$CI_PROJECT_DIR/ci_artifacts/project1/benchmark-trigger.yml"
      unset handoff_b64

  artifacts:
    paths:
      - ci_artifacts/project1/benchmark-trigger.yml
    expire_in: 30 days
    when: on_success

trigger-phase1-benchmark:
  stage: benchmark

  trigger:
    include:
      - artifact: ci_artifacts/project1/benchmark-trigger.yml
        job: prepare-phase1-benchmark-trigger
    strategy: depend
