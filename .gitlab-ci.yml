stages:
  - smoke

variables:
  GPU_RUNNER_TAG: "finetune-gpu"

gpu-runner-smoke-test:
  stage: smoke

  tags:
    - $GPU_RUNNER_TAG

  script:
    - echo "=== SELECTED RUNNER TAG ==="
    - echo "$GPU_RUNNER_TAG"

    - echo "=== HOST ==="
    - hostname

    - echo "=== USER ==="
    - whoami
    - id

    - echo "=== GPU ==="
    - nvidia-smi --query-gpu=index,name,memory.used,memory.total --format=csv,noheader

    - echo "=== DOCKER ==="
    - docker version --format '{{.Server.Version}}'

    - echo "=== RUNNER SMOKE TEST PASSED ==="